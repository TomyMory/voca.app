<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視線・顔フリック文字盤ツール</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; background-color: #2c3e50; color: #ecf0f1; font-family: sans-serif; overflow: hidden; user-select: none; }
        
        /* トップバー領域（高さ25%） */
        #top-bar { height: 25vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #1a252f; padding: 10px; box-sizing: border-box; border-bottom: 4px solid #34495e; position: relative; }
        
        .text-display { width: 85%; height: 60px; font-size: 38px; text-align: center; border-radius: 10px; background-color: #ecf0f1; color: #2c3e50; font-weight: bold; padding: 10px; margin-bottom: 8px; display: flex; justify-content: center; align-items: center; white-space: nowrap; overflow: hidden; }
        #current-input { color: #e74c3c; border-bottom: 4px solid #e74c3c; margin-left: 2px; }

        #suggestion-bar { width: 85%; height: 50px; display: flex; gap: 10px; justify-content: center; }
        .suggest-btn { flex: 1; max-width: 180px; background-color: #f39c12; color: white; font-size: 20px; font-weight: bold; border-radius: 8px; border: none; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: all 0.1s; overflow: hidden; white-space: nowrap; padding: 0 10px; }
        
        /* 独立した全部消すボタン */
        #btn-clear-all { position: absolute; right: 20px; top: 20px; background-color: #e74c3c; color: white; padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 18px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        /* キーボード領域（幅を85%に縮小して顔の移動量を減らす） */
        #keyboard { height: 75vh; width: 85%; max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; padding: 15px; box-sizing: border-box; }
        
        .key, .ctrl-btn { border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; transition: all 0.1s ease-out; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .key { background-color: #34495e; color: white; }
        .key .main-char { font-size: 40px; pointer-events: none; }
        .key .sub-chars { font-size: 14px; color: #95a5a6; margin-top: 5px; pointer-events: none; }
        
        .ctrl-btn { background-color: #7f8c8d; color: white; }
        .ctrl-btn .main-char { font-size: 26px; pointer-events: none; }
        .ctrl-btn .sub-chars { font-size: 12px; color: #ecf0f1; margin-top: 5px; pointer-events: none; }

        /* 特殊ボタンの色分け */
        #key-del { background-color: #e67e22; }
        #key-enter { background-color: #27ae60; }
        #key-speak { background-color: #8e44ad; }
        .mode-btn { background-color: #95a5a6; }

        /* 視覚フィードバック（ホバー・準備・決定） */
        .hit-target.hovered { background-color: #f1c40f !important; color: #2c3e50 !important; transform: scale(1.05); box-shadow: 0 8px 15px rgba(241, 196, 15, 0.4) !important; z-index: 100; }
        .hit-target.ready { background-color: #3498db !important; color: white !important; transform: scale(1.1) !important; box-shadow: 0 0 20px #3498db !important; border: 2px solid #fff; z-index: 101; }
        .hit-target.blink { background-color: #2ecc71 !important; color: white !important; transform: scale(1.15) !important; box-shadow: 0 0 25px #2ecc71 !important; transition: 0s !important; z-index: 102; }

        /* フリックメニュー */
        #flick-overlay { position: absolute; z-index: 1000; display: none; pointer-events: none; }
        .flick-petal { position: absolute; width: 80px; height: 80px; background: #2980b9; border: 4px solid white; border-radius: 15px; color: white; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; transform: translate(-50%, -50%); transition: all 0.1s ease-out; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .flick-petal.hovered { background: #f1c40f !important; color: #2c3e50 !important; transform: translate(-50%, -50%) scale(1.15); border-color: #2c3e50; z-index: 1001; }
        .flick-petal.ready { background-color: #3498db !important; color: white !important; transform: translate(-50%, -50%) scale(1.2) !important; box-shadow: 0 0 20px #3498db !important; border-color: #fff !important; z-index: 1002; }
        .flick-petal.blink { background-color: #2ecc71 !important; transform: translate(-50%, -50%) scale(1.25) !important; box-shadow: 0 0 25px #2ecc71 !important; transition: 0s !important; z-index: 1003; }
        
        .petal-c { top: 0; left: 0; background: #e74c3c; z-index: 1000; }
        .petal-l { top: 0; left: -90px; }
        .petal-t { top: -90px; left: 0; }
        .petal-r { top: 0; left: 90px; }
        .petal-b { top: 90px; left: 0; }

        #status-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; text-align: center; color: white; }
        #start-btn { padding: 15px 30px; font-size: 24px; background-color: #3498db; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; display: none; }
        #warning-msg { position: absolute; top: 40%; width: 100%; text-align: center; color: #ff3b3b; font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.7); padding: 20px 0; display: none; z-index: 3000; }

        #calib-target { position: absolute; width: 40px; height: 40px; background-color: #e74c3c; border: 4px solid white; border-radius: 50%; transform: translate(-50%, -50%); display: none; z-index: 2100; box-shadow: 0 0 15px #e74c3c; transition: all 0.1s; }
        #practice-target { position: absolute; width: 160px; height: 160px; background-color: #e67e22; border: 4px solid white; border-radius: 20px; transform: translate(-50%, -50%); display: none; z-index: 2100; box-shadow: 0 0 20px rgba(230,126,34,0.8); flex-direction: column; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; text-align: center; color: white; transition: all 0.1s ease-out; }
        #calib-instruction { position: absolute; top: 10%; width: 100%; text-align: center; font-size: 28px; font-weight: bold; color: #f1c40f; display: none; z-index: 2100; text-shadow: 2px 2px 4px #000; white-space: pre-wrap; pointer-events: none; }
        
        #cursor { position: absolute; width: 30px; height: 30px; background-color: rgba(231, 76, 60, 0.8); border: 3px solid white; border-radius: 50%; transform: translate(-50%, -50%); z-index: 2500; pointer-events: none; display: none; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="text-display">
            <span id="confirmed-text"></span><span id="current-input"></span>
        </div>
        <div id="suggestion-bar"></div>
        <div id="btn-clear-all" class="ctrl-btn hit-target top-hit" data-action="clear">✖ 全消し</div>
    </div>

    <!-- 5列×4段 スマホ風レイアウト -->
    <div id="keyboard">
        <!-- 1段目 -->
        <div class="ctrl-btn hit-target mode-btn" data-action="mode" data-val="number"><div class="main-char">123</div></div>
        <div class="key hit-target dynamic-key" data-id="0"></div>
        <div class="key hit-target dynamic-key" data-id="1"></div>
        <div class="key hit-target dynamic-key" data-id="2"></div>
        <div class="ctrl-btn hit-target" id="key-del" data-action="delete"><div class="main-char">⌫</div><div class="sub-chars">1文字消す</div></div>
        
        <!-- 2段目 -->
        <div class="ctrl-btn hit-target mode-btn" data-action="mode" data-val="alphabet"><div class="main-char">ABC</div></div>
        <div class="key hit-target dynamic-key" data-id="3"></div>
        <div class="key hit-target dynamic-key" data-id="4"></div>
        <div class="key hit-target dynamic-key" data-id="5"></div>
        <div class="ctrl-btn hit-target" id="key-enter" data-action="enter"><div class="main-char">⏎</div><div class="sub-chars">確定</div></div>
        
        <!-- 3段目 -->
        <div class="ctrl-btn hit-target mode-btn" data-action="mode" data-val="hiragana"><div class="main-char">あいう</div></div>
        <div class="key hit-target dynamic-key" data-id="6"></div>
        <div class="key hit-target dynamic-key" data-id="7"></div>
        <div class="key hit-target dynamic-key" data-id="8"></div>
        <div class="ctrl-btn hit-target" data-action="space"><div class="main-char">␣</div><div class="sub-chars">空白</div></div>
        
        <!-- 4段目 -->
        <div class="ctrl-btn hit-target" id="key-speak" data-action="speak"><div class="main-char">🗣</div><div class="sub-chars">はなす</div></div>
        <div class="key hit-target dynamic-key" data-id="9"></div>
        <div class="key hit-target dynamic-key" data-id="10"></div>
        <div class="key hit-target dynamic-key" data-id="11"></div>
        <div class="ctrl-btn hit-target" data-action="undo"><div class="main-char">↩</div><div class="sub-chars">1つ戻る</div></div>
    </div>

    <!-- フリック入力展開用オーバーレイ -->
    <div id="flick-overlay">
        <div class="flick-petal hit-target petal-c" data-pid="c" id="petal-c"></div>
        <div class="flick-petal hit-target petal-l" data-pid="l" id="petal-l"></div>
        <div class="flick-petal hit-target petal-t" data-pid="t" id="petal-t"></div>
        <div class="flick-petal hit-target petal-r" data-pid="r" id="petal-r"></div>
        <div class="flick-petal hit-target petal-b" data-pid="b" id="petal-b"></div>
    </div>

    <div id="cursor"></div>
    <video id="webcam" autoplay playsinline muted></video>
    <div id="warning-msg">顔がカメラから離れすぎています。<br>もう少し近づいてください。</div>

    <div id="status-overlay">
        <h2 id="status-text">AIモデルを読み込み中...</h2>
        <p id="status-sub">カメラを許可し、顔を正面に向けてお待ちください。</p>
        <button id="start-btn">調整（キャリブレーション）を開始</button>
    </div>

    <div id="calib-target"></div>
    <div id="practice-target" class="hit-target" style="display: none;">ここを見て<br>口をあける</div>
    <div id="calib-instruction">顔を動かして赤い丸を指してください...</div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const statusText = document.getElementById('status-text');
            if(statusText) {
                statusText.innerText = "システムエラー発生";
                document.getElementById('status-sub').innerText = "行番号: " + lineno + "\n" + message;
            }
        };

        const confirmedTextEl = document.getElementById('confirmed-text');
        const currentInputEl = document.getElementById('current-input');
        const suggestionBar = document.getElementById('suggestion-bar');
        const flickOverlay = document.getElementById('flick-overlay');
        const statusOverlay = document.getElementById('status-overlay');
        const startBtn = document.getElementById('start-btn');
        const warningMsg = document.getElementById('warning-msg');
        const cursor = document.getElementById('cursor');
        
        const calibTarget = document.getElementById('calib-target');
        const practiceTarget = document.getElementById('practice-target');
        const calibInstruction = document.getElementById('calib-instruction');

        let audioUnlocked = false;
        let confirmedText = "";
        let currentInput = "";
        let textHistory = [];
        let currentMode = 'hiragana';

        function saveHistory() {
            textHistory.push({ c: confirmedText, i: currentInput });
            if (textHistory.length > 20) textHistory.shift();
        }

        function updateTextDisplay() {
            confirmedTextEl.innerText = confirmedText;
            currentInputEl.innerText = currentInput;
        }

        // --- ★ 予測変換システム ★ ---
        const localDict = ["ありがとう", "おはよう", "こんにちは", "こんばんは", "おねがいします", "いきたい", "たべたい", "のみたい", "トイレ", "いたい", "あつい", "さむい", "はい", "いいえ"];

        function fetchSuggestions() {
            if (!currentInput) { renderSuggestions([]); return; }
            let candidates = localDict.filter(word => word.startsWith(currentInput) && word !== currentInput);
            const script = document.createElement('script');
            script.src = `https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(currentInput)}&jsonp=googleSuggestCallback`;
            script.onload = () => script.remove();
            script.onerror = () => script.remove();
            document.body.appendChild(script);
            renderSuggestions(candidates.slice(0, 4));
            window.tempLocalCandidates = candidates;
        }

        window.googleSuggestCallback = function(data) {
            let candidates = window.tempLocalCandidates || [];
            if (data && data[0] && data[0][1]) {
                data[0][1].forEach(c => { if (!candidates.includes(c) && c !== currentInput) candidates.push(c); });
            }
            renderSuggestions(candidates.slice(0, 4));
        };

        function renderSuggestions(list) {
            suggestionBar.innerHTML = '';
            list.forEach(word => {
                const btn = document.createElement('div');
                btn.className = 'suggest-btn hit-target top-hit';
                btn.innerText = word;
                btn.dataset.action = 'suggest';
                btn.dataset.val = word;
                suggestionBar.appendChild(btn);
            });
        }

        // --- ★ フリック ＆ キーボード定義 ★ ---
        const flickMap = {
            'あ': { c: 'あ', l: 'い', t: 'う', r: 'え', b: 'お' }, 'か': { c: 'か', l: 'き', t: 'く', r: 'け', b: 'こ' }, 'さ': { c: 'さ', l: 'し', t: 'す', r: 'せ', b: 'そ' },
            'た': { c: 'た', l: 'ち', t: 'つ', r: 'て', b: 'と' }, 'な': { c: 'な', l: 'に', t: 'ぬ', r: 'ね', b: 'の' }, 'は': { c: 'は', l: 'ひ', t: 'ふ', r: 'へ', b: 'ほ' },
            'ま': { c: 'ま', l: 'み', t: 'む', r: 'め', b: 'も' }, 'や': { c: 'や', l: '（', t: 'ゆ', r: '）', b: 'よ' }, 'ら': { c: 'ら', l: 'り', t: 'る', r: 'れ', b: 'ろ' },
            'わ': { c: 'わ', l: 'を', t: 'ん', r: 'ー', b: '〜' }, '記': { c: '、', l: '。', t: '？', r: '！', b: '・' },
            'abc':{ c: 'a', l: 'b', t: 'c' }, 'def':{ c: 'd', l: 'e', t: 'f' }, 'ghi':{ c: 'g', l: 'h', t: 'i' },
            'jkl':{ c: 'j', l: 'k', t: 'l' }, 'mno':{ c: 'm', l: 'n', t: 'o' }, 'pqrs':{ c: 'p', l: 'q', t: 'r', b: 's' },
            'tuv':{ c: 't', l: 'u', t: 'v' }, 'wxyz':{ c: 'w', l: 'x', t: 'y', b: 'z' }, '@#/':{ c: '@', l: '#', t: '/', r: '_' }
        };

        const layouts = {
            hiragana: [
                {b:'あ',s:'いうえお'}, {b:'か',s:'きくけこ'}, {b:'さ',s:'しすせそ'},
                {b:'た',s:'ちつてと'}, {b:'な',s:'にぬねの'}, {b:'は',s:'ひふへほ'},
                {b:'ま',s:'みむめも'}, {b:'や',s:'（ゆ）よ'}, {b:'ら',s:'りるれろ'},
                {b:'mod',m:'小/゛',s:'濁点･半濁点'}, {b:'わ',s:'をんー〜'}, {b:'記',s:'。？！・'}
            ],
            number: [
                {b:'1',m:'1',s:''}, {b:'2',m:'2',s:''}, {b:'3',m:'3',s:''},
                {b:'4',m:'4',s:''}, {b:'5',m:'5',s:''}, {b:'6',m:'6',s:''},
                {b:'7',m:'7',s:''}, {b:'8',m:'8',s:''}, {b:'9',m:'9',s:''},
                {b:'*',m:'*',s:''}, {b:'0',m:'0',s:''}, {b:'#',m:'#',s:''}
            ],
            alphabet: [
                {b:'@#/',m:'@#/',s:''}, {b:'abc',s:''}, {b:'def',s:''},
                {b:'ghi',s:''}, {b:'jkl',s:''}, {b:'mno',s:''},
                {b:'pqrs',s:''}, {b:'tuv',s:''}, {b:'wxyz',s:''},
                {b:'mod',m:'小/゛',s:'大/小'}, {b:' ',m:'空白',s:''}, {b:'記',s:'。？！'}
            ]
        };

        function renderKeyboard() {
            const keys = document.querySelectorAll('.dynamic-key');
            const layout = layouts[currentMode];
            keys.forEach((key, index) => {
                const data = layout[index];
                if(data.b === 'mod' || data.b === ' ' || data.b.match(/^[0-9\*#]$/)) {
                    // フリックなしの単一ボタン
                    key.innerHTML = `<div class="main-char">${data.m || data.b}</div><div class="sub-chars">${data.s || ''}</div>`;
                    key.dataset.action = data.b === 'mod' ? 'dakuten' : (data.b === ' ' ? 'space' : 'input');
                    key.dataset.val = data.b;
                    delete key.dataset.base;
                } else {
                    // フリックありのベースキー
                    key.innerHTML = `<div class="main-char">${data.m || data.b}</div><div class="sub-chars">${data.s || ''}</div>`;
                    key.dataset.base = data.b;
                    delete key.dataset.action;
                }
            });
        }
        renderKeyboard(); // 初期描画

        const dakutenCycle = {
            'か':'が','が':'か','き':'ぎ','ぎ':'き','く':'ぐ','ぐ':'く','け':'げ','げ':'け','こ':'ご','ご':'こ',
            'さ':'ざ','ざ':'さ','し':'じ','じ':'し','す':'ず','ず':'す','せ':'ぜ','ぜ':'せ','そ':'ぞ','ぞ':'そ',
            'た':'だ','だ':'た','ち':'ぢ','ぢ':'ち','つ':'づ','づ':'つ','て':'で','で':'て','と':'ど','ど':'と',
            'は':'ば','ば':'ぱ','ぱ':'は','ひ':'び','び':'ぴ','ぴ':'ひ','ふ':'ぶ','ぶ':'ぷ','ぷ':'ふ',
            'へ':'べ','べ':'ぺ','ぺ':'へ','ほ':'ぼ','ぼ':'ぽ','ぽ':'ほ',
            'あ':'ぁ','ぁ':'あ','い':'ぃ','ぃ':'い','う':'ぅ','ぅ':'う','え':'ぇ','ぇ':'え','お':'ぉ','ぉ':'お',
            'や':'ゃ','ゃ':'や','ゆ':'ゅ','ゅ':'ゆ','よ':'ょ','ょ':'よ','つ':'っ','っ':'つ','わ':'ゎ','ゎ':'わ',
            // アルファベットの大文字小文字対応
            'a':'A','A':'a','b':'B','B':'b','c':'C','C':'c','d':'D','D':'d','e':'E','E':'e','f':'F','F':'f'
        };

        function triggerAction(element) {
            if (!element) return;
            if(!audioUnlocked) { try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){} audioUnlocked = true; }

            const action = element.dataset.action;
            const val = element.dataset.val;

            if (action === 'mode') { currentMode = val; renderKeyboard(); }
            else if (action === 'input') { saveHistory(); currentInput += val; updateTextDisplay(); fetchSuggestions(); }
            else if (action === 'space') { saveHistory(); currentInput += " "; updateTextDisplay(); fetchSuggestions(); }
            else if (action === 'suggest') { saveHistory(); confirmedText += val; currentInput = ""; updateTextDisplay(); renderSuggestions([]); }
            else if (action === 'enter') { 
                saveHistory(); confirmedText += currentInput; currentInput = ""; 
                updateTextDisplay(); renderSuggestions([]); 
            }
            else if (action === 'undo') {
                if (textHistory.length > 0) {
                    const state = textHistory.pop(); confirmedText = state.c; currentInput = state.i;
                    updateTextDisplay(); fetchSuggestions();
                }
            }
            else if (action === 'dakuten') {
                if (currentInput.length > 0) {
                    const lastChar = currentInput.slice(-1);
                    if(dakutenCycle[lastChar]) { saveHistory(); currentInput = currentInput.slice(0, -1) + dakutenCycle[lastChar]; updateTextDisplay(); fetchSuggestions(); }
                } else if (confirmedText.length > 0) {
                    const lastChar = confirmedText.slice(-1);
                    if(dakutenCycle[lastChar]) { saveHistory(); confirmedText = confirmedText.slice(0, -1) + dakutenCycle[lastChar]; updateTextDisplay(); }
                }
            } 
            else if (action === 'speak') {
                let text = confirmedText + currentInput; if (text === "") return;
                const ttsMap = { "こんにちは": "こんにちわ。", "ありがとう": "ありがとう。" };
                if (ttsMap[text]) text = ttsMap[text]; else text = text + "。"; 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP'; utterance.rate = 1.0; speechSynthesis.speak(utterance);
                if (currentInput) { saveHistory(); confirmedText += currentInput; currentInput = ""; updateTextDisplay(); renderSuggestions([]); }
            }
            else if (action === 'delete') {
                saveHistory();
                if (currentInput.length > 0) { currentInput = currentInput.slice(0, -1); fetchSuggestions(); } 
                else if (confirmedText.length > 0) { confirmedText = confirmedText.slice(0, -1); }
                updateTextDisplay();
            }
            else if (action === 'clear') {
                if(confirmedText.length > 0 || currentInput.length > 0) {
                    saveHistory(); confirmedText = ""; currentInput = "";
                    updateTextDisplay(); renderSuggestions([]);
                }
            }
        }

        let gameState = 'loading'; 
        let smoothRatioX = 0.5; let smoothRatioY = 0.5;
        let isMouthOpen = false; let lastClickTime = 0; let hoveredElement = null;
        let activeFlickBase = null;

        let calibData = { center: {x:0, y:0}, top: {x:0, y:0}, bottom: {x:0, y:0}, left: {x:0, y:0}, right: {x:0, y:0} };
        let calibBuffer = [];
        
        const practiceSteps = [
            { id: 'practice_center', x: 0.5, y: 0.5, msg: "【練習 1/5】\n光っている的を見て、\n「口をあけて、とじる」と決定します" },
            { id: 'practice_top', x: 0.5, y: 0.3, msg: "【練習 2/5】\n上の的を見て、口で決定" },
            { id: 'practice_bottom', x: 0.5, y: 0.8, msg: "【練習 3/5】\n下の的を見て、口で決定" },
            { id: 'practice_left', x: 0.2, y: 0.5, msg: "【練習 4/5】\n左の的を見て、口で決定" },
            { id: 'practice_right', x: 0.8, y: 0.5, msg: "【練習 5/5】\n右の的を見て、口で決定" }
        ];
        let currentPracticeIndex = 0;

        function mapRange(value, inMin, inMax, outMin, outMax) {
            const range = inMax - inMin;
            if (Math.abs(range) < 0.01) return (outMin + outMax) / 2; 
            let ratio = (value - inMin) / range;
            return outMin + (outMax - outMin) * ratio;
        }

        startBtn.addEventListener('click', () => {
            try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); audioUnlocked = true; } catch(e) {}
            statusOverlay.style.background = 'rgba(0,0,0,0.5)';
            document.getElementById('status-text').style.display = 'none'; document.getElementById('status-sub').style.display = 'none'; 
            startBtn.style.display = 'none';
            runCalibrationStep('center', 50, 50, '【1/5】顔を動かして、\n画面【中央】の赤い丸に鼻先を向けてください');
        });

        function runCalibrationStep(step, xPercent, yPercent, message) {
            gameState = `calib_${step}`; calibBuffer = [];
            calibTarget.style.display = 'block'; calibInstruction.style.display = 'block';
            calibInstruction.innerText = message;
            calibTarget.style.left = `${xPercent}%`; calibTarget.style.top = `${yPercent}%`;

            setTimeout(() => {
                calibInstruction.innerText = "【記録中...】そのまま顔を止めてお待ちください";
                setTimeout(() => {
                    let avgX = 0, avgY = 0;
                    if(calibBuffer.length > 0) { calibBuffer.forEach(d => { avgX += d.x; avgY += d.y; }); calibData[step] = { x: avgX / calibBuffer.length, y: avgY / calibBuffer.length }; }
                    
                    if(step === 'center') runCalibrationStep('top', 50, 20, '【2/5】顔を上に向けて、\n画面【上部】の赤い丸に鼻先を向けてください');
                    else if(step === 'top') runCalibrationStep('bottom', 50, 80, '【3/5】顔を下に向けて、\n画面【下部】の赤い丸に鼻先を向けてください');
                    else if(step === 'bottom') runCalibrationStep('left', 20, 50, '【4/5】顔を左に向けて、\n画面【左部】の赤い丸に鼻先を向けてください');
                    else if(step === 'left') runCalibrationStep('right', 80, 50, '【5/5】顔を右に向けて、\n画面【右部】の赤い丸に鼻先を向けてください');
                    else if(step === 'right') { calibTarget.style.display = 'none'; startPracticePhase(); }
                }, 1200); 
            }, 800); 
        }

        function startPracticePhase() {
            currentPracticeIndex = 0; cursor.style.display = 'block'; showPracticeTarget();
        }

        function showPracticeTarget() {
            if (currentPracticeIndex >= practiceSteps.length) {
                practiceTarget.style.display = 'none'; calibInstruction.style.display = 'none';
                statusOverlay.style.display = 'none'; gameState = 'playing'; cursor.style.display = 'none'; return;
            }
            const step = practiceSteps[currentPracticeIndex]; gameState = step.id;
            practiceTarget.style.display = 'flex'; practiceTarget.style.left = `${step.x * 100}%`; practiceTarget.style.top = `${step.y * 100}%`;
            calibInstruction.innerText = step.msg;
        }
        function advancePractice() { currentPracticeIndex++; showPracticeTarget(); }

        function showFlickMenu(baseChar, keyElement) {
            activeFlickBase = baseChar;
            const rect = keyElement.getBoundingClientRect();
            let fx = rect.left + rect.width/2; let fy = rect.top + rect.height/2;
            const safeMargin = 140; 
            fx = Math.max(safeMargin, Math.min(window.innerWidth - safeMargin, fx));
            fy = Math.max(safeMargin, Math.min(window.innerHeight - safeMargin, fy));

            flickOverlay.style.left = `${fx}px`; flickOverlay.style.top = `${fy}px`;
            
            const map = flickMap[baseChar];
            const petals = ['c', 'l', 't', 'r', 'b'];
            petals.forEach(p => {
                const petalElem = document.getElementById(`petal-${p}`);
                if(map[p]) {
                    petalElem.style.display = 'flex';
                    petalElem.innerText = map[p]; petalElem.dataset.char = map[p];
                } else {
                    petalElem.style.display = 'none'; // アルファベット等でない方向を隠す
                }
                petalElem.classList.remove('hovered', 'ready');
            });
            flickOverlay.style.display = 'block';
        }

        function hideFlickMenu() { activeFlickBase = null; flickOverlay.style.display = 'none'; }

        function onResults(results) {
            if (gameState === 'loading') {
                gameState = 'ready'; 
                document.getElementById('status-text').innerText = "準備完了";
                document.getElementById('status-sub').innerText = "見つめたボタンが光ります。「口をあけて、とじる」と決定します。\n音声の準備をするため、下のボタンを押してください。";
                startBtn.style.display = 'block';
            }

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                const faceTop = landmarks[10]; const faceBottom = landmarks[152];
                const faceHeight = Math.hypot(faceTop.x - faceBottom.x, faceTop.y - faceBottom.y);
                const faceWidth = Math.abs(landmarks[234].x - landmarks[454].x);

                if (faceWidth < 0.20) { warningMsg.style.display = 'block'; return; } 
                else { warningMsg.style.display = 'none'; }

                const nose = landmarks[1];

                if (gameState.startsWith('calib_')) {
                    if (calibInstruction.innerText.includes("記録中")) calibBuffer.push({ x: nose.x, y: nose.y });
                } 
                else if (gameState.startsWith('practice_') || gameState === 'playing') {
                    
                    let targetRatioX = mapRange(nose.x, calibData.left.x, calibData.right.x, 0.0, 1.0);
                    let targetRatioY = mapRange(nose.y, calibData.top.y, calibData.bottom.y, 0.0, 1.0);
                    
                    // ★ 動きを増幅させて画面端に届きやすくする（感度アップ）★
                    targetRatioX = 0.5 + (targetRatioX - 0.5) * 1.5;
                    targetRatioY = 0.5 + (targetRatioY - 0.5) * 1.5;
                    // 下方向はさらにブースト
                    if (targetRatioY > 0.5) { targetRatioY = 0.5 + (targetRatioY - 0.5) * 1.2; }
                    
                    targetRatioX = Math.max(-0.1, Math.min(1.1, targetRatioX));
                    targetRatioY = Math.max(-0.1, Math.min(1.1, targetRatioY));

                    smoothRatioX += (targetRatioX - smoothRatioX) * 0.6; 
                    smoothRatioY += (targetRatioY - smoothRatioY) * 0.6;

                    let cursorPx = smoothRatioX * window.innerWidth;
                    let cursorPy = smoothRatioY * window.innerHeight;

                    if (gameState.startsWith('practice_')) {
                        cursor.style.left = `${cursorPx}px`; cursor.style.top = `${cursorPy}px`;
                    }

                    let elementUnderCursor = null;

                    // --- ★ 最寄り（距離が一番近い）ボタンを探してスナップする ★ ---
                    let interactiveElements = [];
                    if (gameState.startsWith('practice_')) {
                        interactiveElements = [practiceTarget];
                    } else if (activeFlickBase) {
                        // フリック中は花びらのみ
                        interactiveElements = Array.from(document.querySelectorAll('.flick-petal')).filter(e => e.style.display !== 'none');
                    } else {
                        // 通常時は全てのボタン
                        interactiveElements = Array.from(document.querySelectorAll('.hit-target'));
                    }

                    let minDist = Infinity;
                    interactiveElements.forEach(el => {
                        let rect = el.getBoundingClientRect();
                        if(rect.width === 0) return;
                        let cx = rect.left + rect.width / 2;
                        let cy = rect.top + rect.height / 2;
                        let dist = Math.hypot(cursorPx - cx, cursorPy - cy);
                        
                        // トップバーのボタンは少し引力を強くして当たりやすくする
                        if(el.classList.contains('top-hit')) { dist *= 0.6; }

                        if(dist < minDist) { minDist = dist; elementUnderCursor = el; }
                    });

                    // 状態の更新
                    if (hoveredElement && hoveredElement !== elementUnderCursor) {
                        hoveredElement.classList.remove('hovered', 'ready');
                    }
                    if (elementUnderCursor) {
                        elementUnderCursor.classList.add('hovered');
                        if (isMouthOpen) elementUnderCursor.classList.add('ready');
                        hoveredElement = elementUnderCursor;
                    } else {
                        hoveredElement = null;
                    }

                    // --- 口の開閉判定 ---
                    const upperLip = landmarks[13]; const lowerLip = landmarks[14];
                    const mouthRatio = Math.hypot(upperLip.x - lowerLip.x, upperLip.y - lowerLip.y) / faceHeight;
                    const MOUTH_OPEN_THRESH = 0.055; 
                    const MOUTH_CLOSE_THRESH = 0.025;

                    if (mouthRatio > MOUTH_OPEN_THRESH) {
                        if (!isMouthOpen) {
                            isMouthOpen = true;
                            if (gameState.startsWith('practice_')) cursor.classList.add('ready');
                            if (hoveredElement) hoveredElement.classList.add('ready');
                            
                            // フリックメニューの展開
                            if (gameState === 'playing' && hoveredElement && hoveredElement.dataset.base) {
                                showFlickMenu(hoveredElement.dataset.base, hoveredElement);
                            }
                        }
                    } 
                    else if (isMouthOpen && mouthRatio < MOUTH_CLOSE_THRESH) {
                        isMouthOpen = false;
                        if (gameState.startsWith('practice_')) cursor.classList.remove('ready');
                        
                        const now = Date.now();
                        if (now - lastClickTime > 600) { 
                            lastClickTime = now;
                            
                            if (gameState.startsWith('practice_')) {
                                cursor.classList.add('blink');
                                setTimeout(() => cursor.classList.remove('blink'), 200);
                            }

                            if (hoveredElement) {
                                hoveredElement.classList.remove('ready');
                                hoveredElement.classList.add('blink');
                                setTimeout(() => hoveredElement.classList.remove('blink'), 200);
                            }

                            if (activeFlickBase && hoveredElement && hoveredElement.classList.contains('flick-petal')) {
                                triggerInput(hoveredElement.dataset.char);
                                hideFlickMenu();
                            } 
                            else if (hoveredElement) {
                                if (gameState.startsWith('practice_') && hoveredElement.id === 'practice-target') {
                                    advancePractice();
                                } 
                                else if (gameState === 'playing' && hoveredElement.dataset.action) {
                                    triggerAction(hoveredElement);
                                }
                            }
                        }
                    } 
                    else if (!isMouthOpen && hoveredElement && !activeFlickBase) {
                        hoveredElement.classList.remove('ready');
                    }
                }
            } else {
                warningMsg.innerText = "顔が認識されていません。"; warningMsg.style.display = 'block';
            }
        }

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.hit-target');
            if (!btn) return;
            if(btn.classList.contains('flick-petal')) { triggerInput(btn.dataset.char); hideFlickMenu(); } 
            else if(btn.dataset.base) { triggerInput(flickMap[btn.dataset.base].c); } 
            else if(btn.dataset.action) { triggerAction(btn); }
        });

        const video = document.getElementById('webcam');
        const faceMesh = new FaceMesh({locateFile: (file) => { return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`; }});
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);
        try {
            const camera = new Camera(video, { onFrame: async () => { await faceMesh.send({image: video}); }, width: 640, height: 480 });
            camera.start().catch(err => {
                document.getElementById('status-text').innerText = "カメラ起動エラー";
                document.getElementById('status-sub').innerText = "カメラのアクセスが許可されていないか、他のアプリが使用中です。";
            });
        } catch(e) {
            document.getElementById('status-text').innerText = "システムエラー";
            document.getElementById('status-sub').innerText = e.toString();
        }
    </script>
</body>
</html>
