<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視線・顔フリック文字盤ツール</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; background-color: #2c3e50; color: #ecf0f1; font-family: sans-serif; overflow: hidden; user-select: none; }
        
        #top-bar { height: 25vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #1a252f; padding: 10px; box-sizing: border-box; border-bottom: 4px solid #34495e; }
        
        .text-display { width: 90%; height: 60px; font-size: 38px; text-align: center; border-radius: 10px; background-color: #ecf0f1; color: #2c3e50; font-weight: bold; padding: 10px; margin-bottom: 8px; display: flex; justify-content: center; align-items: center; white-space: nowrap; overflow: hidden; }
        #current-input { color: #e74c3c; border-bottom: 4px solid #e74c3c; margin-left: 2px; }

        #suggestion-bar { width: 90%; height: 50px; display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
        .suggest-btn { flex: 1; max-width: 180px; background-color: #f39c12; color: white; font-size: 22px; font-weight: bold; border-radius: 8px; border: none; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: all 0.1s; cursor: pointer; overflow: hidden; white-space: nowrap; padding: 0 10px; }
        
        .controls { display: flex; gap: 20px; width: 90%; justify-content: center; }
        
        #keyboard { height: 75vh; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 15px; box-sizing: border-box; }
        
        .key { background-color: #34495e; color: white; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; transition: all 0.1s ease-out; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .key .main-char { font-size: 45px; pointer-events: none; }
        .key .sub-chars { font-size: 16px; color: #95a5a6; margin-top: 5px; pointer-events: none; }
        
        .ctrl-btn { background-color: #7f8c8d; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; transition: all 0.1s ease-out; cursor: pointer; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .top-ctrl-btn { flex: 1; max-width: 200px; padding: 8px; font-size: 18px; border: none; border-radius: 8px; }
        .ctrl-btn .main-char { font-size: 30px; pointer-events: none; }
        .ctrl-btn .sub-chars { font-size: 14px; color: #ecf0f1; margin-top: 5px; pointer-events: none; }

        #key-del { background-color: #e67e22; }
        #key-undo { background-color: #3498db; }
        #key-speak { background-color: #27ae60; }
        #key-mod { background-color: #8e44ad; }
        .btn-red { background-color: #e74c3c !important; }

        /* キーボードボタンのアニメーション */
        .key.hovered, .ctrl-btn.hovered, .suggest-btn.hovered { background-color: #f1c40f !important; color: #2c3e50 !important; transform: scale(1.05); box-shadow: 0 8px 15px rgba(241, 196, 15, 0.4) !important; }
        .key.ready, .ctrl-btn.ready, .suggest-btn.ready { background-color: #3498db !important; color: white !important; transform: scale(1.1) !important; box-shadow: 0 0 20px #3498db !important; border: 2px solid #fff; }
        .key.blink, .ctrl-btn.blink, .suggest-btn.blink { background-color: #2ecc71 !important; color: white !important; transform: scale(1.15) !important; box-shadow: 0 0 25px #2ecc71 !important; transition: 0s !important; }

        /* ★ 的（練習用）のスタイル：ブレ防止のため拡大アニメーションを削除し、発光のみにする ★ */
        #practice-target { position: absolute; width: 160px; height: 160px; background-color: #e67e22; border: 4px solid white; border-radius: 20px; transform: translate(-50%, -50%); display: none; z-index: 2100; flex-direction: column; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; text-align: center; color: white; transition: background-color 0.1s, box-shadow 0.1s; }
        #practice-target.hovered { background-color: #f1c40f !important; color: #2c3e50 !important; box-shadow: 0 0 30px rgba(241, 196, 15, 0.8) !important; }
        #practice-target.ready { background-color: #3498db !important; box-shadow: 0 0 30px #3498db !important; color: white !important; border: 4px solid #fff; }
        #practice-target.blink { background-color: #2ecc71 !important; box-shadow: 0 0 40px #2ecc71 !important; transition: 0s !important; }

        video { display: none; }
        
        #flick-overlay { position: absolute; z-index: 1000; display: none; pointer-events: none; }
        .flick-petal { position: absolute; width: 80px; height: 80px; background: #2980b9; border: 4px solid white; border-radius: 15px; color: white; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; transform: translate(-50%, -50%); transition: all 0.1s ease-out; pointer-events: auto; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .flick-petal.active { background: #f1c40f; color: #2c3e50; transform: translate(-50%, -50%) scale(1.15); border-color: #2c3e50; z-index: 1001; }
        .flick-petal.ready { transform: translate(-50%, -50%) scale(1.2) !important; background-color: #3498db !important; box-shadow: 0 0 20px #3498db !important; border-color: #fff !important; }
        .flick-petal.blink { transform: translate(-50%, -50%) scale(1.25) !important; background-color: #2ecc71 !important; box-shadow: 0 0 25px #2ecc71 !important; transition: 0s !important; }
        
        .petal-c { top: 0; left: 0; background: #e74c3c; z-index: 1000; }
        .petal-l { top: 0; left: -90px; }
        .petal-t { top: -90px; left: 0; }
        .petal-r { top: 0; left: 90px; }
        .petal-b { top: 90px; left: 0; }

        #status-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; text-align: center; }
        #start-btn { padding: 15px 30px; font-size: 24px; background-color: #3498db; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; display: none; }
        #warning-msg { position: absolute; top: 40%; width: 100%; text-align: center; color: #ff3b3b; font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.7); padding: 20px 0; display: none; z-index: 3000; }

        #calib-target { position: absolute; width: 40px; height: 40px; background-color: #e74c3c; border: 4px solid white; border-radius: 50%; transform: translate(-50%, -50%); display: none; z-index: 2100; box-shadow: 0 0 15px #e74c3c; transition: all 0.1s; }
        #calib-instruction { position: absolute; top: 10%; width: 100%; text-align: center; font-size: 28px; font-weight: bold; color: #f1c40f; display: none; z-index: 2100; text-shadow: 2px 2px 4px #000; white-space: pre-wrap; pointer-events: none; }
        
        /* ★ 練習用カーソルスタイル ★ */
        #cursor { position: absolute; width: 30px; height: 30px; background-color: rgba(231, 76, 60, 0.8); border: 3px solid white; border-radius: 50%; transform: translate(-50%, -50%); z-index: 2500; pointer-events: none; transition: width 0.1s, height 0.1s; box-shadow: 0 0 10px rgba(0,0,0,0.5); display: none; }
        #cursor.ready { background-color: #3498db; width: 45px; height: 45px; border: 4px solid #fff; }
        #cursor.blink { background-color: #2ecc71; width: 60px; height: 60px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="text-display">
            <span id="confirmed-text"></span><span id="current-input"></span>
        </div>
        <div id="suggestion-bar"></div>
        <div class="controls">
            <button class="ctrl-btn top-ctrl-btn btn-red" data-action="clear">✖ 全部消す</button>
        </div>
    </div>

    <div id="keyboard">
        <div class="key base-key" data-base="あ"><div class="main-char">あ</div><div class="sub-chars">い う え お</div></div>
        <div class="key base-key" data-base="か"><div class="main-char">か</div><div class="sub-chars">き く け こ</div></div>
        <div class="key base-key" data-base="さ"><div class="main-char">さ</div><div class="sub-chars">し す せ そ</div></div>
        <div class="key ctrl-btn" id="key-del" data-action="delete"><div class="main-char">⌫</div><div class="sub-chars">1文字消す</div></div>
        
        <div class="key base-key" data-base="た"><div class="main-char">た</div><div class="sub-chars">ち つ て と</div></div>
        <div class="key base-key" data-base="な"><div class="main-char">な</div><div class="sub-chars">に ぬ ね の</div></div>
        <div class="key base-key" data-base="は"><div class="main-char">は</div><div class="sub-chars">ひ ふ へ ほ</div></div>
        <div class="key ctrl-btn" id="key-undo" data-action="undo"><div class="main-char">↩</div><div class="sub-chars">1つ戻す</div></div>
        
        <div class="key base-key" data-base="ま"><div class="main-char">ま</div><div class="sub-chars">み む め も</div></div>
        <div class="key base-key" data-base="や"><div class="main-char">や</div><div class="sub-chars">（ ゆ ） よ</div></div>
        <div class="key base-key" data-base="ら"><div class="main-char">ら</div><div class="sub-chars">り る れ ろ</div></div>
        <div class="key ctrl-btn" id="key-mod" data-action="dakuten"><div class="main-char">゛゜</div><div class="sub-chars">濁点/半濁点</div></div>
        
        <div class="key base-key" data-base="わ"><div class="main-char">わ</div><div class="sub-chars">を ん ー 〜</div></div>
        <div class="key base-key" data-base="小"><div class="main-char">小</div><div class="sub-chars">っ ゅ ゃ ょ</div></div>
        <div class="key base-key" data-base="記"><div class="main-char">、</div><div class="sub-chars">。 ？ ！ ・</div></div>
        <div class="key ctrl-btn" id="key-speak" data-action="speak"><div class="main-char">🗣</div><div class="sub-chars">はなす</div></div>
    </div>

    <div id="flick-overlay">
        <div class="flick-petal petal-c" id="petal-c"></div>
        <div class="flick-petal petal-l" id="petal-l"></div>
        <div class="flick-petal petal-t" id="petal-t"></div>
        <div class="flick-petal petal-r" id="petal-r"></div>
        <div class="flick-petal petal-b" id="petal-b"></div>
    </div>

    <!-- ★ 練習用のカーソル ★ -->
    <div id="cursor"></div>

    <video id="webcam" autoplay playsinline muted></video>
    <div id="warning-msg">顔がカメラから離れすぎています。<br>もう少し近づいてください。</div>

    <div id="status-overlay">
        <h2 id="status-text">AIモデルを読み込み中...</h2>
        <p id="status-sub">カメラを許可し、顔を正面に向けてお待ちください。</p>
        <button id="start-btn">調整（キャリブレーション）を開始</button>
    </div>

    <div id="calib-target"></div>
    <div id="practice-target" style="display: none;">ここを見て<br>口をあける</div>
    <div id="calib-instruction">顔を動かして赤い丸を指してください...</div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const statusText = document.getElementById('status-text');
            const statusSub = document.getElementById('status-sub');
            if(statusText && statusSub) {
                statusText.innerText = "システムエラー発生";
                statusText.style.color = "#ff3b3b";
                statusSub.innerText = "行番号: " + lineno + "\n" + message;
            }
        };

        const confirmedTextEl = document.getElementById('confirmed-text');
        const currentInputEl = document.getElementById('current-input');
        const suggestionBar = document.getElementById('suggestion-bar');
        const flickOverlay = document.getElementById('flick-overlay');
        const statusOverlay = document.getElementById('status-overlay');
        const startBtn = document.getElementById('start-btn');
        const warningMsg = document.getElementById('warning-msg');
        const cursor = document.getElementById('cursor');
        
        const calibTarget = document.getElementById('calib-target');
        const practiceTarget = document.getElementById('practice-target');
        const calibInstruction = document.getElementById('calib-instruction');

        let audioUnlocked = false;
        let confirmedText = "";
        let currentInput = "";
        let textHistory = [];

        function saveHistory() {
            textHistory.push({ c: confirmedText, i: currentInput });
            if (textHistory.length > 20) textHistory.shift();
        }

        function updateTextDisplay() {
            confirmedTextEl.innerText = confirmedText;
            currentInputEl.innerText = currentInput;
        }

        const localDict = [
            "ありがとう", "おはよう", "こんにちは", "こんばんは", "さようなら", "おねがいします", "おつかれさま",
            "いきたい", "たべたい", "のみたい", "かえりたい", "たすけて", "きてください", 
            "トイレ", "いたい", "くるしい", "あつい", "さむい", "かゆい", "ねむい", "はい", "いいえ", "ごめんなさい"
        ];

        function fetchSuggestions() {
            if (!currentInput) { renderSuggestions([]); return; }
            let candidates = localDict.filter(word => word.startsWith(currentInput) && word !== currentInput);
            const script = document.createElement('script');
            script.src = `https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(currentInput)}&jsonp=googleSuggestCallback`;
            script.onload = () => script.remove();
            script.onerror = () => script.remove();
            document.body.appendChild(script);
            renderSuggestions(candidates.slice(0, 4));
            window.tempLocalCandidates = candidates;
        }

        window.googleSuggestCallback = function(data) {
            let candidates = window.tempLocalCandidates || [];
            if (data && data[0] && data[0][1]) {
                const apiCands = data[0][1];
                apiCands.forEach(c => {
                    if (!candidates.includes(c) && c !== currentInput) candidates.push(c);
                });
            }
            renderSuggestions(candidates.slice(0, 4));
        };

        function renderSuggestions(list) {
            suggestionBar.innerHTML = '';
            list.forEach(word => {
                const btn = document.createElement('div');
                btn.className = 'suggest-btn';
                btn.innerText = word;
                btn.dataset.text = word;
                btn.addEventListener('click', () => triggerSuggestion(word));
                suggestionBar.appendChild(btn);
            });
        }

        function triggerSuggestion(word) {
            saveHistory(); confirmedText += word; currentInput = "";
            updateTextDisplay(); renderSuggestions([]); 
        }

        const flickMap = {
            'あ': { c: 'あ', l: 'い', t: 'う', r: 'え', b: 'お' },
            'か': { c: 'か', l: 'き', t: 'く', r: 'け', b: 'こ' },
            'さ': { c: 'さ', l: 'し', t: 'す', r: 'せ', b: 'そ' },
            'た': { c: 'た', l: 'ち', t: 'つ', r: 'て', b: 'と' },
            'な': { c: 'な', l: 'に', t: 'ぬ', r: 'ね', b: 'の' },
            'は': { c: 'は', l: 'ひ', t: 'ふ', r: 'へ', b: 'ほ' },
            'ま': { c: 'ま', l: 'み', t: 'む', r: 'め', b: 'も' },
            'や': { c: 'や', l: '（', t: 'ゆ', r: '）', b: 'よ' },
            'ら': { c: 'ら', l: 'り', t: 'る', r: 'れ', b: 'ろ' },
            'わ': { c: 'わ', l: 'を', t: 'ん', r: 'ー', b: '〜' },
            '小': { c: '小', l: 'っ', t: 'ゅ', r: 'ゃ', b: 'ょ' },
            '記': { c: '、', l: '。', t: '？', r: '！', b: '・' }
        };

        const dakutenCycle = {
            'か':'が','が':'か','き':'ぎ','ぎ':'き','く':'ぐ','ぐ':'く','け':'げ','げ':'け','こ':'ご','ご':'こ',
            'さ':'ざ','ざ':'さ','し':'じ','じ':'し','す':'ず','ず':'す','せ':'ぜ','ぜ':'せ','そ':'ぞ','ぞ':'そ',
            'た':'だ','だ':'た','ち':'ぢ','ぢ':'ち','つ':'づ','づ':'つ','て':'で','で':'て','と':'ど','ど':'と',
            'は':'ば','ば':'ぱ','ぱ':'は','ひ':'び','び':'ぴ','ぴ':'ひ','ふ':'ぶ','ぶ':'ぷ','ぷ':'ふ',
            'へ':'べ','べ':'ぺ','ぺ':'へ','ほ':'ぼ','ぼ':'ぽ','ぽ':'ほ',
            'あ':'ぁ','ぁ':'あ','い':'ぃ','ぃ':'い','う':'ぅ','ぅ':'う','え':'ぇ','ぇ':'え','お':'ぉ','ぉ':'お',
            'や':'ゃ','ゃ':'や','ゆ':'ゅ','ゅ':'ゆ','よ':'ょ','ょ':'よ','つ':'っ','っ':'つ','わ':'ゎ','ゎ':'わ'
        };

        function speakText() {
            let text = confirmedText + currentInput;
            if (text === "") return;
            const ttsMap = { "こんにちは": "こんにちわ。", "ありがとう": "ありがとう。", "おはよう": "おはようございます。", "さようなら": "さようなら。" };
            if (ttsMap[text]) text = ttsMap[text]; else text = text + "。"; 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP'; utterance.rate = 1.0; speechSynthesis.speak(utterance);
            
            if (currentInput) {
                saveHistory(); confirmedText += currentInput; currentInput = "";
                updateTextDisplay(); renderSuggestions([]);
            }
        }

        function triggerAction(element) {
            if (!element) return;
            if(!audioUnlocked) { try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(e){} audioUnlocked = true; }
            const action = element.dataset.action;

            if (action === 'undo') {
                if (textHistory.length > 0) {
                    const state = textHistory.pop(); confirmedText = state.c; currentInput = state.i;
                    updateTextDisplay(); fetchSuggestions();
                }
            }
            else if (action === 'dakuten') {
                if (currentInput.length > 0) {
                    const lastChar = currentInput.slice(-1);
                    if(dakutenCycle[lastChar]) { saveHistory(); currentInput = currentInput.slice(0, -1) + dakutenCycle[lastChar]; updateTextDisplay(); fetchSuggestions(); }
                } else if (confirmedText.length > 0) {
                    const lastChar = confirmedText.slice(-1);
                    if(dakutenCycle[lastChar]) { saveHistory(); confirmedText = confirmedText.slice(0, -1) + dakutenCycle[lastChar]; updateTextDisplay(); }
                }
            } 
            else if (action === 'speak') { speakText(); }
            else if (action === 'delete') {
                saveHistory();
                if (currentInput.length > 0) { currentInput = currentInput.slice(0, -1); fetchSuggestions(); } 
                else if (confirmedText.length > 0) { confirmedText = confirmedText.slice(0, -1); }
                updateTextDisplay();
            }
            else if (action === 'clear') {
                if(confirmedText.length > 0 || currentInput.length > 0) {
                    saveHistory(); confirmedText = ""; currentInput = "";
                    updateTextDisplay(); renderSuggestions([]);
                }
            }
        }

        function triggerInput(char) {
            if(char && char !== '小') { saveHistory(); currentInput += char; updateTextDisplay(); fetchSuggestions(); }
        }

        let gameState = 'loading'; 
        let smoothRatioX = 0.5; let smoothRatioY = 0.5;
        
        let isMouthOpen = false; let lastClickTime = 0; let hoveredElement = null;
        let activeFlickBase = null; let flickStartRatioX = 0; let flickStartRatioY = 0; let currentFlickSelection = 'c';

        let calibData = { center: {x:0, y:0}, top: {x:0, y:0}, bottom: {x:0, y:0}, left: {x:0, y:0}, right: {x:0, y:0} };
        let calibBuffer = [];
        
        const practiceSteps = [
            { id: 'practice_center', x: 0.5, y: 0.5, msg: "【練習 1/5】\n光っている的を見て、\n「口をあけて、とじる」と決定します" },
            { id: 'practice_top', x: 0.5, y: 0.3, msg: "【練習 2/5】\n上の的を見て、口で決定" },
            { id: 'practice_bottom', x: 0.5, y: 0.8, msg: "【練習 3/5】\n下の的を見て、口で決定" },
            { id: 'practice_left', x: 0.2, y: 0.5, msg: "【練習 4/5】\n左の的を見て、口で決定" },
            { id: 'practice_right', x: 0.8, y: 0.5, msg: "【練習 5/5】\n右の的を見て、口で決定" }
        ];
        let currentPracticeIndex = 0;

        function mapRange(value, inMin, inMax, outMin, outMax) {
            const range = inMax - inMin;
            if (Math.abs(range) < 0.01) return (outMin + outMax) / 2; 
            let ratio = (value - inMin) / range;
            ratio = Math.max(-0.2, Math.min(1.2, ratio));
            return outMin + (outMax - outMin) * ratio;
        }

        startBtn.addEventListener('click', () => {
            try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); audioUnlocked = true; } catch(e) {}
            statusOverlay.style.background = 'rgba(0,0,0,0.5)';
            document.getElementById('status-text').style.display = 'none'; document.getElementById('status-sub').style.display = 'none'; 
            startBtn.style.display = 'none';
            runCalibrationStep('center', 50, 50, '【1/5】顔を動かして、\n画面【中央】の赤い丸に鼻先を向けてください');
        });

        function runCalibrationStep(step, xPercent, yPercent, message) {
            gameState = `calib_${step}`; calibBuffer = [];
            calibTarget.style.display = 'block'; calibInstruction.style.display = 'block';
            calibInstruction.innerText = message;
            calibTarget.style.left = `${xPercent}%`; calibTarget.style.top = `${yPercent}%`;

            setTimeout(() => {
                calibInstruction.innerText = "【記録中...】そのまま顔を止めてお待ちください";
                setTimeout(() => {
                    let avgX = 0, avgY = 0;
                    if(calibBuffer.length > 0) { calibBuffer.forEach(d => { avgX += d.x; avgY += d.y; }); calibData[step] = { x: avgX / calibBuffer.length, y: avgY / calibBuffer.length }; }
                    
                    if(step === 'center') runCalibrationStep('top', 50, 20, '【2/5】顔を上に向けて、\n画面【上部】の赤い丸に鼻先を向けてください');
                    else if(step === 'top') runCalibrationStep('bottom', 50, 80, '【3/5】顔を下に向けて、\n画面【下部】の赤い丸に鼻先を向けてください');
                    else if(step === 'bottom') runCalibrationStep('left', 20, 50, '【4/5】顔を左に向けて、\n画面【左部】の赤い丸に鼻先を向けてください');
                    else if(step === 'left') runCalibrationStep('right', 80, 50, '【5/5】顔を右に向けて、\n画面【右部】の赤い丸に鼻先を向けてください');
                    else if(step === 'right') {
                        calibTarget.style.display = 'none';
                        startPracticePhase();
                    }
                }, 1200); 
            }, 800); 
        }

        function startPracticePhase() {
            currentPracticeIndex = 0; showPracticeTarget();
        }

        function showPracticeTarget() {
            if (currentPracticeIndex >= practiceSteps.length) {
                practiceTarget.style.display = 'none'; calibInstruction.style.display = 'none';
                statusOverlay.style.display = 'none'; 
                gameState = 'playing'; 
                cursor.style.display = 'none'; // 本番はカーソルを完全に消す
                return;
            }
            const step = practiceSteps[currentPracticeIndex]; gameState = step.id;
            practiceTarget.style.display = 'flex'; practiceTarget.style.left = `${step.x * 100}%`; practiceTarget.style.top = `${step.y * 100}%`;
            calibInstruction.innerText = step.msg;
        }

        function advancePractice() {
            currentPracticeIndex++; showPracticeTarget();
        }

        function showFlickMenu(baseChar, keyElement) {
            activeFlickBase = baseChar;
            flickStartRatioX = smoothRatioX; flickStartRatioY = smoothRatioY;
            currentFlickSelection = 'c';

            const rect = keyElement.getBoundingClientRect();
            let fx = rect.left + rect.width/2; let fy = rect.top + rect.height/2;
            const safeMargin = 140; 
            fx = Math.max(safeMargin, Math.min(window.innerWidth - safeMargin, fx));
            fy = Math.max(safeMargin, Math.min(window.innerHeight - safeMargin, fy));

            flickOverlay.style.left = `${fx}px`; flickOverlay.style.top = `${fy}px`;
            
            const map = flickMap[baseChar];
            const petals = ['c', 'l', 't', 'r', 'b'];
            petals.forEach(p => {
                const petalElem = document.getElementById(`petal-${p}`);
                petalElem.innerText = map[p]; petalElem.dataset.char = map[p];
                if(map[p] === '小') { petalElem.style.opacity = '0.5'; } else { petalElem.style.opacity = '1'; }
                if (p === 'c') petalElem.classList.add('active', 'ready');
                else petalElem.classList.remove('active', 'ready');
            });
            flickOverlay.style.display = 'block';
        }

        function hideFlickMenu() {
            activeFlickBase = null; flickOverlay.style.display = 'none';
        }

        function onResults(results) {
            if (gameState === 'loading') {
                gameState = 'ready'; 
                document.getElementById('status-text').innerText = "準備完了";
                document.getElementById('status-sub').innerText = "見つめたボタンが光ります。「口をあけて、とじる」と決定します。\n音声の準備をするため、下のボタンを押してください。";
                startBtn.style.display = 'block';
            }

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                const faceTop = landmarks[10]; const faceBottom = landmarks[152];
                const faceHeight = Math.hypot(faceTop.x - faceBottom.x, faceTop.y - faceBottom.y);
                const faceWidth = Math.abs(landmarks[234].x - landmarks[454].x);

                if (faceWidth < 0.20) { warningMsg.style.display = 'block'; return; } 
                else { warningMsg.style.display = 'none'; }

                const nose = landmarks[1];

                if (gameState.startsWith('calib_')) {
                    if (calibInstruction.innerText.includes("記録中")) calibBuffer.push({ x: nose.x, y: nose.y });
                } 
                else if (gameState.startsWith('practice_') || gameState === 'playing') {
                    
                    let targetRatioX = mapRange(nose.x, calibData.left.x, calibData.right.x, 0.0, 1.0);
                    let targetRatioY = mapRange(nose.y, calibData.top.y, calibData.bottom.y, 0.0, 1.0);
                    
                    if (targetRatioY > 0.5) { targetRatioY = 0.5 + (targetRatioY - 0.5) * 1.5; }
                    
                    targetRatioX = Math.max(0, Math.min(1.0, targetRatioX));
                    targetRatioY = Math.max(0, Math.min(1.0, targetRatioY));

                    smoothRatioX += (targetRatioX - smoothRatioX) * 0.7; 
                    smoothRatioY += (targetRatioY - smoothRatioY) * 0.7;

                    let cursorPx = smoothRatioX * window.innerWidth;
                    let cursorPy = smoothRatioY * window.innerHeight;

                    // ★ 練習中のみカーソルを表示し、座標を同期する ★
                    if (gameState.startsWith('practice_')) {
                        cursor.style.display = 'block';
                        cursor.style.left = `${cursorPx}px`;
                        cursor.style.top = `${cursorPy}px`;
                    } else {
                        cursor.style.display = 'none';
                    }

                    let elementUnderCursor = null;

                    if (activeFlickBase) {
                        const dx = smoothRatioX - flickStartRatioX;
                        const dy = smoothRatioY - flickStartRatioY;
                        const threshold = 0.15; 

                        if (Math.hypot(dx, dy) < threshold) { currentFlickSelection = 'c'; } 
                        else {
                            if (Math.abs(dx) > Math.abs(dy)) { currentFlickSelection = dx < 0 ? 'l' : 'r'; } 
                            else { currentFlickSelection = dy < 0 ? 't' : 'b'; }
                        }

                        ['c', 'l', 't', 'r', 'b'].forEach(p => {
                            const petal = document.getElementById(`petal-${p}`);
                            if (p === currentFlickSelection) {
                                petal.classList.add('active');
                                if (isMouthOpen) petal.classList.add('ready');
                            } else {
                                petal.classList.remove('active', 'ready');
                            }
                        });
                    } 
                    // ★ 練習用の的の当たり判定（ピクセル距離で計算するため絶対にブレない） ★
                    else if (gameState.startsWith('practice_')) {
                        const step = practiceSteps[currentPracticeIndex];
                        const targetPx = step.x * window.innerWidth;
                        const targetPy = step.y * window.innerHeight;
                        const dist = Math.hypot(cursorPx - targetPx, cursorPy - targetPy);
                        
                        // 150ピクセル以内なら的に当たっていると判定（甘めの設定）
                        if (dist < 150) {
                            elementUnderCursor = practiceTarget;
                        }
                    }
                    else if (gameState === 'playing') {
                        if (smoothRatioY < 0.25) {
                            const suggestions = document.querySelectorAll('.suggest-btn');
                            if (suggestions.length > 0) {
                                const stepX = 1.0 / suggestions.length;
                                let btnIndex = Math.floor(smoothRatioX / stepX);
                                btnIndex = Math.min(btnIndex, suggestions.length - 1);
                                elementUnderCursor = suggestions[btnIndex];
                            }
                        } else {
                            let kbRatioY = (smoothRatioY - 0.25) / 0.75;
                            let col = Math.floor(smoothRatioX * 4);
                            let row = Math.floor(kbRatioY * 4);
                            col = Math.max(0, Math.min(3, col));
                            row = Math.max(0, Math.min(3, row));
                            
                            const keyIndex = row * 4 + col;
                            const keys = document.querySelectorAll('#keyboard .key, #keyboard .ctrl-btn');
                            elementUnderCursor = keys[keyIndex];
                        }
                    }

                    if (!activeFlickBase) {
                        if (hoveredElement && hoveredElement !== elementUnderCursor) {
                            hoveredElement.classList.remove('hovered', 'ready');
                        }
                        if (elementUnderCursor) {
                            elementUnderCursor.classList.add('hovered');
                            if (isMouthOpen) elementUnderCursor.classList.add('ready');
                            hoveredElement = elementUnderCursor;
                        } else {
                            hoveredElement = null;
                        }
                    }

                    const upperLip = landmarks[13]; const lowerLip = landmarks[14];
                    const mouthRatio = Math.hypot(upperLip.x - lowerLip.x, upperLip.y - lowerLip.y) / faceHeight;
                    const MOUTH_OPEN_THRESH = 0.055; 
                    const MOUTH_CLOSE_THRESH = 0.025;

                    if (mouthRatio > MOUTH_OPEN_THRESH) {
                        if (!isMouthOpen) {
                            isMouthOpen = true;
                            if (gameState.startsWith('practice_')) cursor.classList.add('ready');
                            if (hoveredElement) hoveredElement.classList.add('ready');
                            
                            if (gameState === 'playing' && hoveredElement && hoveredElement.classList.contains('base-key')) {
                                showFlickMenu(hoveredElement.dataset.base, hoveredElement);
                            }
                        }
                    } 
                    else if (isMouthOpen && mouthRatio < MOUTH_CLOSE_THRESH) {
                        isMouthOpen = false;
                        if (gameState.startsWith('practice_')) cursor.classList.remove('ready');
                        
                        const now = Date.now();
                        if (now - lastClickTime > 600) { 
                            lastClickTime = now;
                            
                            if (gameState.startsWith('practice_')) {
                                cursor.classList.add('blink');
                                setTimeout(() => cursor.classList.remove('blink'), 200);
                            }

                            let targetToBlink = activeFlickBase ? document.getElementById(`petal-${currentFlickSelection}`) : hoveredElement;

                            if (targetToBlink) {
                                targetToBlink.classList.remove('ready');
                                targetToBlink.classList.add('blink');
                                setTimeout(() => targetToBlink.classList.remove('blink'), 200);
                            }

                            if (activeFlickBase) {
                                let charToInput = flickMap[activeFlickBase][currentFlickSelection];
                                triggerInput(charToInput);
                                hideFlickMenu();
                            } 
                            else if (hoveredElement) {
                                if (gameState.startsWith('practice_') && hoveredElement.id === 'practice-target') {
                                    advancePractice();
                                } 
                                else if (gameState === 'playing' && hoveredElement.classList.contains('suggest-btn')) {
                                    triggerSuggestion(hoveredElement.dataset.text);
                                }
                                else if (gameState === 'playing' && hoveredElement.classList.contains('ctrl-btn')) {
                                    triggerAction(hoveredElement);
                                }
                            }
                        }
                    } 
                    else if (!isMouthOpen && hoveredElement && !activeFlickBase) {
                        hoveredElement.classList.remove('ready');
                    }
                }
            } else {
                warningMsg.innerText = "顔が認識されていません。"; warningMsg.style.display = 'block';
            }
        }

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.key, .ctrl-btn, .flick-petal, .top-ctrl-btn, .suggest-btn');
            if (!btn) return;
            if(btn.classList.contains('flick-petal')) { triggerInput(btn.dataset.char); hideFlickMenu(); } 
            else if(btn.classList.contains('base-key')) { triggerInput(flickMap[btn.dataset.base].c); } 
            else if(btn.classList.contains('suggest-btn')) { triggerSuggestion(btn.dataset.text); } 
            else { triggerAction(btn); }
        });

        const video = document.getElementById('webcam');
        const faceMesh = new FaceMesh({locateFile: (file) => { return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`; }});
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);
        try {
            const camera = new Camera(video, { onFrame: async () => { await faceMesh.send({image: video}); }, width: 640, height: 480 });
            camera.start().catch(err => {
                document.getElementById('status-text').innerText = "カメラ起動エラー";
                document.getElementById('status-sub').innerText = "カメラのアクセスが許可されていないか、他のアプリが使用中です。";
            });
        } catch(e) {
            document.getElementById('status-text').innerText = "システムエラー";
            document.getElementById('status-sub').innerText = e.toString();
        }
    </script>
</body>
</html>
